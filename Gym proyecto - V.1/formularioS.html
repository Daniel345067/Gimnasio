<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.10.4/dayjs.min.js"></script>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="registrostyle.css">
</head>
<body>

    <form action="" id="frmS">
        <label for="">Dirección de correo electronico</label>
        <input type="text" placeholder="Ingrese su correo electronico registrado" id="correoR">
        <label for="">Elija el membresia elegida</label>
        <select name="tipo_plan" id="tipo_plan">
            <option value="Seleccione">Seleccione</option> 
            <option value="P hierro">Plan hierro</option>
            <option value="P acero">Plan acero</option>
            <option value="P platino">Plan platino</option>
            <option value="P titaneo">Plan titaneo</option>
        </select>
        <label for="">Seleccione la cantidad de meses</label>
        <select name="tiempo_suscripcion" id="tiempo_suscripcion">
            <option value="opcion">Seleccione una opcción</option>
            <option value="1">1 mes</option>
            <option value="2">2 meses</option>
            <option value="3">3 meses</option>
            <option value="4">4 meses</option>
            <option value="5">5 meses</option>
            <option value="6">6 meses</option>
            <option value="7">7 meses</option>
            <option value="8">8 meses</option>
            <option value="9">9 meses</option>
            <option value="10">10 meses</option>
            <option value="11">11 meses</option>
            <option value="12">12 meses</option>
        </select>
        <button type="submit">Suscribirse</button>
        



    </form>
    
    <script src="registrard.js"></script>

</body>
</html>
